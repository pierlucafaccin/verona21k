<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0E1218">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Verona 21K">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<title>Verona 21K</title>
<style>
  :root{
    /* night palette — evening running, scoreboard legibility */
    --bg:#0E1218;
    --surface:#161C25;
    --raised:#1E2733;
    --hairline:#2A3542;
    --text:#EAEEF4;
    --dim:#8B97A8;
    --faint:#5D6878;

    /* intensity ramp — used semantically, never decoratively */
    --z-rec:#4A6FA5;
    --z-easy:#4E8FC4;
    --z-mar:#3FA89B;
    --z-thr:#E0A23C;
    --z-int:#DC6B45;
    --z-race:#D94F3D;
    --z-rest:#4C5666;

    --ok:#4FA87C;
    --warn:#E0A23C;
    --bad:#DC6B45;

    --r:14px;
    --r-sm:9px;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;

    --tabh:58px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    font-size:16px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  .num{font-variant-numeric:tabular-nums;letter-spacing:-.02em;}

  /* ---------- shell ---------- */
  .screen{
    display:none;
    padding:calc(env(safe-area-inset-top,0px) + 14px) 16px
            calc(env(safe-area-inset-bottom,0px) + var(--tabh) + 22px);
    min-height:100%;
  }
  .screen.on{display:block;}

  .head{margin-bottom:18px;}
  .head .kicker{font-size:13px;color:var(--dim);margin:0 0 2px;}
  .head h1{
    font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0;
  }

  /* ---------- tab bar ---------- */
  nav.tabs{
    position:fixed;left:0;right:0;bottom:0;z-index:50;
    display:grid;grid-template-columns:repeat(3,1fr);
    background:rgba(14,18,24,.92);
    backdrop-filter:saturate(1.4) blur(14px);
    -webkit-backdrop-filter:saturate(1.4) blur(14px);
    border-top:1px solid var(--hairline);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  nav.tabs button{
    appearance:none;background:none;border:0;cursor:pointer;
    height:var(--tabh);
    color:var(--faint);
    font-family:var(--sans);font-size:11px;font-weight:600;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  }
  nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;}
  nav.tabs button[aria-selected="true"]{color:var(--text);}
  nav.tabs button:focus-visible{outline:2px solid var(--z-easy);outline-offset:-3px;}

  /* ---------- cards ---------- */
  .card{background:var(--surface);border-radius:var(--r);padding:16px;margin-bottom:12px;}
  .card.flush{padding:0;overflow:hidden;}

  /* ---------- today hero ---------- */
  .sesh{position:relative;background:var(--surface);border-radius:var(--r);overflow:hidden;margin-bottom:12px;}
  .sesh .stripe{height:3px;background:var(--z-rest);}
  .sesh .body{padding:18px 16px 16px;}
  .sesh .type{font-size:12px;font-weight:700;color:var(--dim);margin:0 0 6px;}
  .sesh h2{font-size:23px;font-weight:700;letter-spacing:-.025em;line-height:1.2;margin:0 0 14px;}
  .sesh .figs{display:flex;gap:26px;margin-bottom:4px;}
  .fig .v{display:block;font-size:27px;font-weight:700;line-height:1;}
  .fig .l{display:block;font-size:11px;color:var(--dim);margin-top:4px;}

  .steps{list-style:none;margin:14px 0 0;padding:0;}
  .steps li{
    position:relative;padding:0 0 0 16px;margin-bottom:8px;
    font-size:14.5px;color:#C8D1DC;line-height:1.5;
  }
  .steps li::before{
    content:"";position:absolute;left:0;top:.62em;
    width:5px;height:5px;border-radius:50%;background:var(--faint);
  }
  .steps li:last-child{margin-bottom:0;}

  /* ---------- pace ladder (signature) ---------- */
  .ladder{margin:4px 0 12px;}
  .ladder .lbl{font-size:12px;color:var(--dim);margin-bottom:9px;}
  .rung{display:grid;grid-template-columns:78px 1fr 92px;align-items:center;gap:10px;padding:5px 0;}
  .rung .nm{font-size:13px;color:var(--dim);}
  .rung .bar{height:7px;border-radius:4px;background:var(--hairline);position:relative;overflow:hidden;}
  .rung .bar i{position:absolute;inset:0;border-radius:4px;}
  .rung .pv{font-size:13.5px;font-weight:600;text-align:right;color:#C8D1DC;}
  .rung.hit .nm,.rung.hit .pv{color:var(--text);font-weight:700;}

  /* ---------- log form ---------- */
  .log{border-top:1px solid var(--hairline);margin-top:16px;padding-top:16px;}
  .log h3{font-size:13px;font-weight:600;color:var(--dim);margin:0 0 12px;}
  .fields{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
  .f label{display:block;font-size:11px;color:var(--dim);margin-bottom:5px;}
  .f input,.log textarea{
    width:100%;background:var(--raised);border:1px solid var(--hairline);
    color:var(--text);border-radius:var(--r-sm);
    padding:11px 10px;font-family:var(--sans);font-size:16px;
    font-variant-numeric:tabular-nums;
  }
  .log textarea{margin-top:9px;font-size:15px;resize:vertical;min-height:44px;}
  .f input:focus,.log textarea:focus{outline:none;border-color:var(--z-easy);}
  .btn{
    appearance:none;border:0;border-radius:var(--r-sm);cursor:pointer;
    font-family:var(--sans);font-size:15px;font-weight:600;
    padding:13px 16px;background:var(--raised);color:var(--text);
  }
  .btn.wide{width:100%;margin-top:11px;}
  .btn.go{background:var(--z-easy);color:#08121C;}
  .btn.sm{font-size:13px;padding:9px 13px;}
  .btn:active{transform:scale(.99);}
  .btn:focus-visible{outline:2px solid var(--z-easy);outline-offset:2px;}

  .flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
  .flag{font-size:12px;font-weight:600;padding:5px 10px;border-radius:20px;}
  .flag.ok{background:rgba(79,168,124,.16);color:var(--ok);}
  .flag.warn{background:rgba(224,162,60,.16);color:var(--warn);}
  .flag.bad{background:rgba(220,107,69,.16);color:var(--bad);}
  .flag.info{background:rgba(78,143,196,.16);color:var(--z-easy);}

  .done{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14.5px;}
  .done input{width:21px;height:21px;accent-color:var(--ok);}

  /* ---------- week navigator ---------- */
  .wknav{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .wknav button{
    appearance:none;border:1px solid var(--hairline);background:var(--surface);
    color:var(--text);width:38px;height:38px;border-radius:var(--r-sm);
    font-size:17px;cursor:pointer;flex:0 0 auto;
  }
  .wknav button:disabled{opacity:.3;}
  .wknav .mid{flex:1 1 auto;text-align:center;}
  .wknav .mid b{display:block;font-size:15px;font-weight:700;}
  .wknav .mid span{display:block;font-size:12px;color:var(--dim);}

  .wkmeta{display:flex;gap:18px;margin-bottom:10px;padding:0 2px;}
  .wkmeta div{font-size:12px;color:var(--dim);}
  .wkmeta b{color:var(--text);font-weight:700;font-size:15px;display:block;}

  .note{
    font-size:13.5px;color:#B3BECB;line-height:1.5;
    background:var(--surface);border-radius:var(--r);padding:13px 14px;margin-bottom:12px;
    border-left:3px solid var(--z-mar);
  }

  /* ---------- day rows ---------- */
  .days{background:var(--surface);border-radius:var(--r);overflow:hidden;}
  .day{border-bottom:1px solid var(--hairline);}
  .day:last-child{border-bottom:0;}
  .day > button{
    appearance:none;background:none;border:0;width:100%;cursor:pointer;
    display:grid;grid-template-columns:44px 3px 1fr auto;gap:11px;align-items:center;
    padding:13px 14px;text-align:left;font-family:var(--sans);color:var(--text);
  }
  .day .dow{font-size:11px;color:var(--faint);line-height:1.25;}
  .day .dow b{display:block;font-size:16px;font-weight:700;color:var(--dim);}
  .day.today .dow b{color:var(--z-thr);}
  .day .tick{width:3px;height:30px;border-radius:2px;background:var(--z-rest);}
  .day .t{font-size:14.5px;font-weight:600;line-height:1.3;}
  .day .s{font-size:12px;color:var(--dim);margin-top:2px;}
  .day .chk{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--hairline);flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;}
  .day.did .chk{background:var(--ok);border-color:var(--ok);color:#08121C;}
  .day .panel{display:none;padding:0 14px 15px 72px;}
  .day.open .panel{display:block;}
  .day .panel .steps li{font-size:13.5px;}

  /* ---------- charts ---------- */
  .chart{margin-bottom:12px;}
  .chart h3{font-size:14px;font-weight:700;margin:0 0 3px;}
  .chart p{font-size:12.5px;color:var(--dim);margin:0 0 12px;line-height:1.45;}
  .chart svg{width:100%;height:auto;display:block;overflow:visible;}
  .ckey{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;}
  .ckey span{font-size:11.5px;color:var(--dim);display:inline-flex;align-items:center;gap:5px;}
  .ckey i{width:9px;height:3px;border-radius:2px;}

  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px;}
  .tile{background:var(--surface);border-radius:var(--r);padding:14px;}
  .tile .v{font-size:25px;font-weight:700;line-height:1;}
  .tile .l{font-size:11.5px;color:var(--dim);margin-top:5px;}

  .empty{background:var(--surface);border-radius:var(--r);padding:26px 18px;text-align:center;}
  .empty p{margin:0;font-size:14px;color:var(--dim);line-height:1.5;}

  /* ---------- sheet ---------- */
  .sheet{
    position:fixed;inset:0;z-index:80;display:none;
    align-items:flex-end;background:rgba(6,9,13,.6);
  }
  .sheet.on{display:flex;}
  .sheet .inner{
    width:100%;background:var(--surface);
    border-radius:18px 18px 0 0;padding:20px 16px calc(env(safe-area-inset-bottom,0px) + 20px);
    max-height:88vh;overflow-y:auto;
  }
  .sheet h3{margin:0 0 6px;font-size:17px;font-weight:700;}
  .sheet p{font-size:13.5px;color:var(--dim);margin:0 0 12px;line-height:1.5;}
  .sheet textarea{
    width:100%;min-height:110px;background:var(--raised);color:var(--text);
    border:1px solid var(--hairline);border-radius:var(--r-sm);padding:11px;
    font-size:13px;font-family:ui-monospace,Menlo,monospace;
  }
  .sheet .row{display:flex;gap:9px;margin-top:12px;}
  .sheet .row .btn{flex:1 1 0;}
  .msg{font-size:12.5px;min-height:17px;margin-top:9px;}

  .gear{
    position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;
    appearance:none;background:var(--surface);border:1px solid var(--hairline);
    width:36px;height:36px;border-radius:50%;color:var(--dim);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .gear svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>
<body>

</button>

<!-- ══════════ OGGI ══════════ -->

<!-- ══════════ PIANO ══════════ -->

<section class="screen" id="scr-stats">

<nav class="tabs" role="tablist">

<script>
/* storage: window.storage dentro Claude, altrimenti localStorage */
(function(){
  if (window.storage && typeof window.storage.get === 'function') return;
  var K='verona21k:training-log', mem={}, ok=(function(){
    try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return true;}catch(e){return false;}
  })();
  window.storage={
    get:function(k){return new Promise(function(res,rej){
      var v=ok?localStorage.getItem(K):(k in mem?mem[k]:null);
      if(v===null||v===undefined)rej(new Error('not found'));else res({key:k,value:v});});},
    set:function(k,v){return new Promise(function(res,rej){
      try{ok?localStorage.setItem(K,v):(mem[k]=v);res({key:k,value:v});}catch(e){rej(e);}});},
    delete:function(k){return new Promise(function(res){
      ok?localStorage.removeItem(K):delete mem[k];res({key:k,deleted:true});});},
    list:function(){return Promise.resolve({keys:[]});}
  };
  if(!ok)console.warn('localStorage non disponibile: i dati non verranno salvati.');
})();
</script>

<script>
(function(){
  "use strict";

  const DAY_KEYS=['mon','tue','wed','thu','fri','sat','sun'];
  const DOW=['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];
  const MONTHS=["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];

  const TYPE={
    recupero:{lbl:'Recupero',c:'var(--z-rec)'},
    facile:  {lbl:'Facile',  c:'var(--z-easy)'},
    lungo:   {lbl:'Lungo',   c:'var(--z-mar)'},
    ritmo:   {lbl:'Soglia',  c:'var(--z-thr)'},
    ripetute:{lbl:'Interval',c:'var(--z-int)'},
    test:    {lbl:'Test',    c:'var(--z-int)'},
    gara:    {lbl:'Gara',    c:'var(--z-race)'},
    bici:    {lbl:'Bici',    c:'var(--z-rec)'},
    riposo:  {lbl:'Riposo',  c:'var(--z-rest)'},
    mobilita:{lbl:'Mobilità',c:'var(--z-rest)'},
    vacanza: {lbl:'Vacanza', c:'var(--z-mar)'}
  };

  const P_REC = "6:20–6:55";   // recupero
  const P_E   = "6:00–6:40";   // easy / lungo
  const P_M   = "5:25–5:35";   // ritmo maratona
  const P_T   = "5:05–5:15";   // soglia
  const P_I   = "4:40–4:50";   // interval
  const P_R   = "4:20–4:30";   // repetition
  const HR_REC = "130–145";
  const HR_E   = "138–152";
  const HR_M   = "155–163";
  const HR_T   = "165–172";
  const HR_I   = "175–185";
  const RP     = "5:00–5:10";  // ritmo gara provvisorio (rivedibile dopo il 25/10)

  function eDet(extra){
    const b = ["Ritmo: "+P_E+" /km — DEVE restare conversazionale", "FC: "+HR_E+" bpm (71-80% della tua max di 190)"];
    return extra ? b.concat(extra) : b;
  }
  function recDet(extra){
    const b = ["Ritmo: "+P_REC+" /km — più lento del facile, senza vergogna", "FC: "+HR_REC+" bpm", "Serve a far circolare sangue nelle gambe, non ad allenare niente"];
    return extra ? b.concat(extra) : b;
  }
  function rip(){
    return ["3 x 15 calf raises (10 bipodalici + 5 monopodalici)", "2 x 30\" equilibrio monopodalico, occhi aperti poi chiusi", "2 x 15 eversione/inversione con elastico", "Mobilità tibio-tarsica"];
  }

  const WEEK_TEMPLATES = [
  // ---------- SETTIMANA 1: recupero post-gara ----------
  { phase:"Recupero post-gara", note:"Hai corso una mezza a tutta ieri. Questa settimana NON si allena: si recupera. Il muscolo è micro-danneggiato anche se non fa male, e il sistema nervoso è svuotato. Correre forte adesso ruba settimane al blocco di Verona.", days:{
      mon:{type:'riposo', km:0, title:"Riposo totale", detail:["Zero corsa. Cammina, stretching leggero se ti va.","Se hai indolenzimento muscolare è normale e passa in 2-4 giorni."]},
      tue:{type:'recupero', km:5, dur:"32'", title:"Recupero 5 km", targetPace:P_REC, targetHr:HR_REC, detail:recDet(["Prima uscita post-gara: se le gambe protestano, cammina e riprova domani"])},
      wed:{type:'mobilita', km:0, title:"Mobilità caviglia + riposo", detail:rip()},
      thu:{type:'facile', km:6, dur:"38'", title:"Facile 6 km", targetPace:P_E, targetHr:HR_E, detail:eDet()},
      fri:{type:'riposo', km:0, title:"Riposo", detail:["Riposo completo."]},
      sat:{type:'facile', km:7, dur:"44'", title:"Facile 7 km", targetPace:P_E, targetHr:HR_E, detail:eDet()},
      sun:{type:'facile', km:8, dur:"50'", title:"Facile 8 km", targetPace:P_E, targetHr:HR_E, detail:eDet(["Niente lungo questa settimana, niente progressioni, niente finali tirati"])}
  }},
  // ---------- SETTIMANA 2 ----------
  { phase:"Ripresa struttura", note:"Si rientra nella routine a 6 giorni. Nota bene: i giorni facili sono a 6:00-6:40, non a 5:30 come tutta l'estate. Questo è IL cambiamento che rende sostenibile il volume che arriva.", days:{
      mon:{type:'recupero', km:5, dur:"32'", title:"Recupero 5 km", targetPace:P_REC, targetHr:HR_REC, detail:recDet()},
      tue:{type:'ritmo', km:9, dur:"~55'", title:"Soglia: 4 km @ T", tag:"Qualità", targetHr:HR_T, detail:[
        "3 km riscaldamento @ "+P_E,
        "4 km continui @ "+P_T+" /km (FC "+HR_T+") — sforzo 'comodamente duro', frasi brevi",
        "2 km defaticamento @ "+P_E,
        "Se non riesci a tenere il ritmo negli ultimi 1000 m, la prossima volta si accorcia: la soglia si corre COMPLETA, non a esaurimento"
      ]},
      wed:{type:'facile', km:6, dur:"38'", title:"Facile 6 km", targetPace:P_E, targetHr:HR_E, detail:eDet()},
      thu:{type:'facile', km:7, dur:"44'", title:"Facile 7 km + allunghi", targetPace:P_E, targetHr:HR_E, detail:eDet(["A fine corsa: 6 x 100 m progressivi, recupero camminando 90\"","Giorno di smart working: se vuoi la bici la sera, tienila blanda"])},

  const PLAN_START=new Date(2026,8,21);

  const pad=n=>String(n).padStart(2,'0');
  const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const addD=(d,n)=>{const r=new Date(d);r.setDate(r.getDate()+n);return r;};
  const fmt=d=>d.getDate()+' '+MONTHS[d.getMonth()];
  const dkey=d=>DAY_KEYS[(d.getDay()+6)%7];

  /* date -> {entry, week, date} */
  const MAP={};
  WEEK_TEMPLATES.forEach((wt,w)=>DAY_KEYS.forEach((k,i)=>{
    const d=addD(MON0,w*7+i);
    MAP[iso(d)]={entry:wt.days[k],week:w,date:d};
  }));
  const ALL=Object.keys(MAP).sort();
  const PLAN_KM=ALL.reduce((s,k)=>s+(MAP[k].entry.km||0),0);
  const SESSIONS=ALL.filter(k=>MAP[k].entry.type!=='riposo');

  /* ---------- pace / hr helpers ---------- */
  /* Accetta 5:35, 5.35, 5,35 e anche solo cifre (535 -> 5:35, 1005 -> 10:05).
     Serve perché il tastierino numerico di iOS non ha i due punti. */
  function normPace(v){
    const t=String(v==null?'':v).trim();
    if(!t)return null;
    let m=/^(\d{1,2})[:.,](\d{2})$/.exec(t);
    if(!m){const d=t.replace(/\D/g,'');if(d.length===3||d.length===4)m=[d,d.slice(0,-2),d.slice(-2)];}
    if(!m||+m[2]>59)return null;
    return (+m[1])+':'+m[2];
  }
  const p2s=s=>{const n=normPace(s);if(!n)return null;const q=n.split(':');return +q[0]*60+ +q[1];};
  const s2p=v=>Math.floor(v/60)+':'+pad(Math.round(v%60));
  function rng(str){
    if(!str)return null;
    const p=String(str).split(/[–-]/);
    if(p.length!==2)return null;
    const a=p2s(p[0]),b=p2s(p[1]);
    return (a==null||b==null)?null:[a,b];
  }
  function hrRng(str){
    if(!str)return null;
    const p=String(str).split(/[–-]/).map(x=>parseInt(x,10));
    return (p.length!==2||p.some(isNaN))?null:p;
  }
  function flags(e,d){
    if(!d)return [];
    const out=[];
    const pr=rng(e.targetPace), ps=p2s(d.pace);
    if(pr&&ps!=null){
      if(ps<pr[0])out.push(['info','Più veloce del previsto']);
      else if(ps>pr[1])out.push(['warn','Più lento del previsto']);
      else out.push(['ok','Ritmo in target']);
    }
    const hq=hrRng(e.targetHr);
    if(hq&&d.hr!=null&&!isNaN(d.hr)){
      if(d.hr>hq[1])out.push(['bad','FC sopra il target']);
      else if(d.hr<hq[0])out.push(['info','FC sotto il target']);
      else out.push(['ok','FC in target']);
    }
    return out;
  }

  async function load(){
    try{const r=await window.storage.get('training-log',false);if(r&&r.value)log=JSON.parse(r.value);}
    catch(e){log={};}
    let changed=false;
    Object.keys(SEED).forEach(k=>{if(!log[k]){log[k]=SEED[k];changed=true;}});
    Object.keys(log).forEach(k=>{
      const e=log[k];
      if(e&&e.pace){const n=normPace(e.pace);if(n&&n!==e.pace){e.pace=n;changed=true;}}
    });
    if(changed)await save();
  }
  async function save(){
    try{await window.storage.set('training-log',JSON.stringify(log),false);}
    catch(e){console.error('save failed',e);}
  }
  const did=k=>!!(log[k]&&log[k].done);

    log[k]=Object.assign({},log[k]||{},{done:v});

  /* ---------- pace ladder ---------- */
  const LADDER=[
    ['Recupero',P_REC,'var(--z-rec)','recupero'],
    ['Facile',P_E,'var(--z-easy)','facile'],
    ['Maratona',P_M,'var(--z-mar)','lungo'],
    ['Soglia',P_T,'var(--z-thr)','ritmo'],
    ['Interval',P_I,'var(--z-int)','ripetute']
  ];
  function ladderHtml(activeType){
    const all=LADDER.map(r=>rng(r[1])).filter(Boolean);
    const lo=Math.min(...all.map(r=>r[0])), hi=Math.max(...all.map(r=>r[1]));
    const span=hi-lo||1;
    let h='<div class="ladder"><div class="lbl">Le tue andature — VDOT 40</div>';
    LADDER.forEach(r=>{
      const q=rng(r[1]); if(!q)return;
      // faster pace = smaller seconds; draw fast on the right
      const left=(hi-q[1])/span*100, w=Math.max(6,(q[1]-q[0])/span*100);
      const hit=r[3]===activeType?' hit':'';
      h+='<div class="rung'+hit+'"><span class="nm">'+r[0]+'</span>'+
         '<span class="bar"><i style="left:'+left.toFixed(1)+'%;width:'+w.toFixed(1)+'%;background:'+r[2]+'"></i></span>'+
         '<span class="pv num">'+r[1]+'</span></div>';
    });
    return h+'</div>';
  }

    h+='<label class="done"><input type="checkbox" id="cDone" '+(did(k)?'checked':'')+'> Seduta completata</label>';

    box.innerHTML=h;

    document.getElementById('bSave').onclick=()=>{
      const km=parseFloat(String(document.getElementById('iKm').value).replace(',','.'));
      const hr=parseInt(document.getElementById('iHr').value,10);
      const raw=document.getElementById('iPace').value.trim();
      const pc=normPace(raw);
      if(raw&&!pc){
        document.getElementById('iMsg').textContent='Ritmo non valido: scrivi minuti e secondi, per esempio 535 per 5:35.';

  /* ---------- PIANO ---------- */
  function renderPlan(){
    const wt=WEEK_TEMPLATES[curWeek];
    const start=addD(MON0,curWeek*7), end=addD(start,6);
    const keys=[];for(let i=0;i<7;i++)keys.push(iso(addD(start,i)));

    document.getElementById('wkName').textContent='Sett. '+(curWeek+1)+' · '+wt.phase;
    document.getElementById('wkDates').textContent=
      start.getMonth()===end.getMonth()
        ? start.getDate()+'–'+end.getDate()+' '+MONTHS[start.getMonth()]
        : fmt(start)+' – '+fmt(end);

    let pk=0,ak=0,dn=0,tot=0;
    keys.forEach(k=>{
      const e=MAP[k].entry; pk+=e.km||0;
      if(e.type!=='riposo')tot++;
      if(log[k]&&log[k].km)ak+=log[k].km;

    document.getElementById('wkPlanned').textContent=pk.toFixed(0);
    document.getElementById('wkActual').textContent=ak.toFixed(1);
    document.getElementById('wkDone').textContent=dn+'/'+tot;
    document.getElementById('wkNote').textContent=wt.note;
    document.getElementById('wkPrev').disabled=curWeek===0;
    document.getElementById('wkNext').disabled=curWeek===WEEK_TEMPLATES.length-1;

    const todayK=iso(new Date());
    const list=document.getElementById('dayList');
    list.innerHTML=keys.map((k,i)=>{
      const e=MAP[k].entry,t=TYPE[e.type]||TYPE.riposo,d=log[k]||{};
      const bits=[];
      if(e.km)bits.push(e.km+' km');
      if(e.dur)bits.push(e.dur);
      let sub=bits.join(' · ');
      if(d.km!=null||d.pace||d.hr!=null){
        const r=[];
        if(d.km!=null)r.push(d.km+' km');
        if(d.pace)r.push(d.pace+'/km');
        if(d.hr!=null)r.push(d.hr+' bpm');
        sub=r.join(' · ');
      }
      const fl=flags(e,(d.km!=null||d.pace||d.hr!=null)?d:null);
      return '<div class="day'+(did(k)?' did':'')+(k===todayK?' today':'')+(openDay===k?' open':'')+'" data-k="'+k+'">'+
        '<button type="button"><span class="dow">'+DOW[i]+'<b class="num">'+MAP[k].date.getDate()+'</b></span>'+
        '<span class="tick" style="background:'+t.c+'"></span>'+
        '<span><span class="t">'+e.title+'</span><span class="s num">'+sub+'</span></span>'+
        '<span class="chk">✓</span></button>'+
        '<div class="panel"><ul class="steps">'+e.detail.map(x=>'<li>'+x+'</li>').join('')+'</ul>'+
        (fl.length?'<div class="flags">'+fl.map(f=>'<span class="flag '+f[0]+'">'+f[1]+'</span>').join('')+'</div>':'')+
        '</div></div>';
    }).join('');

    list.querySelectorAll('.day > button').forEach(b=>{
      b.onclick=()=>{const k=b.parentNode.dataset.k;openDay=openDay===k?null:k;renderPlan();};
    });
  }

  /* ---------- charts ---------- */
  function svgLine(series,opts){
    // series: [{pts:[{x,y}], color, dash}]  x = index, y = value
    const W=328,H=opts.h||128,L=34,R=8,T=10,B=22;
    const all=series.flatMap(s=>s.pts);
    if(!all.length)return '';
    let lo=Math.min(...all.map(p=>p.y)), hi=Math.max(...all.map(p=>p.y));
    if(lo===hi){lo-=1;hi+=1;}
    const padY=(hi-lo)*.15; lo-=padY; hi+=padY;
    const nx=Math.max(1,opts.n-1);
    const X=i=>L+(i/nx)*(W-L-R);
    const Y=v=>T+(opts.invert?(v-lo)/(hi-lo):(hi-v)/(hi-lo))*(H-T-B);

    let g='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+(opts.aria||'grafico')+'">';
    // gridlines + y labels
    [0,.5,1].forEach(f=>{
      const v=lo+(hi-lo)*f, y=Y(v);
      g+='<line x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(W-R)+'" y2="'+y.toFixed(1)+'" stroke="#2A3542" stroke-width="1"/>';
      g+='<text x="'+(L-6)+'" y="'+(y+3.5).toFixed(1)+'" fill="#5D6878" font-size="9.5" text-anchor="end" font-family="system-ui">'+opts.fmtY(v)+'</text>';
    });
    series.forEach(s=>{
      if(s.pts.length===1){
        g+='<circle cx="'+X(s.pts[0].x)+'" cy="'+Y(s.pts[0].y).toFixed(1)+'" r="3.4" fill="'+s.color+'"/>';
        return;
      }
      const dd=s.pts.map((p,i)=>(i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
      g+='<path d="'+dd+'" fill="none" stroke="'+s.color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"'+
         (s.dash?' stroke-dasharray="3 3"':'')+'/>';
      s.pts.forEach(p=>{g+='<circle cx="'+X(p.x).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="2.6" fill="'+s.color+'"/>';});
    });
    (opts.xLabels||[]).forEach(o=>{
      g+='<text x="'+X(o.x).toFixed(1)+'" y="'+(H-6)+'" fill="#5D6878" font-size="9.5" text-anchor="middle" font-family="system-ui">'+o.t+'</text>';
    });
    return g+'</svg>';
  }

  function svgBars(rows,opts){
    const W=328,H=opts.h||150,L=30,R=6,T=10,B=26;
    const hi=Math.max(...rows.map(r=>Math.max(r.a,r.b)),1);
    const n=rows.length, slot=(W-L-R)/n, bw=Math.min(13,slot*.34);
    let g='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+(opts.aria||'grafico')+'">';
    [0,.5,1].forEach(f=>{
      const v=hi*f, y=T+(1-f)*(H-T-B);
      g+='<line x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(W-R)+'" y2="'+y.toFixed(1)+'" stroke="#2A3542" stroke-width="1"/>';
      g+='<text x="'+(L-5)+'" y="'+(y+3.5).toFixed(1)+'" fill="#5D6878" font-size="9.5" text-anchor="end" font-family="system-ui">'+Math.round(v)+'</text>';
    });
    rows.forEach((r,i)=>{
      const cx=L+slot*(i+.5);
      const ha=(r.a/hi)*(H-T-B), hb=(r.b/hi)*(H-T-B);
      g+='<rect x="'+(cx-bw-1.5).toFixed(1)+'" y="'+(H-B-ha).toFixed(1)+'" width="'+bw+'" height="'+Math.max(0,ha).toFixed(1)+'" rx="2.5" fill="#2F3B4A"/>';
      g+='<rect x="'+(cx+1.5).toFixed(1)+'" y="'+(H-B-hb).toFixed(1)+'" width="'+bw+'" height="'+Math.max(0,hb).toFixed(1)+'" rx="2.5" fill="'+(r.color||'var(--z-mar)')+'"/>';
      g+='<text x="'+cx.toFixed(1)+'" y="'+(H-8)+'" fill="#5D6878" font-size="9.5" text-anchor="middle" font-family="system-ui">'+r.lbl+'</text>';
    });
    return g+'</svg>';
  }

  function renderStats(){
    const box=document.getElementById('statsBody');
    const now=new Date();
    const daysTo=Math.max(0,Math.ceil((RACE_DATE-now)/864e5));
    document.getElementById('statsKicker').textContent=
      daysTo>0?daysTo+' giorni a Verona':'Giorno di gara';

    const logged=ALL.filter(k=>log[k]&&(log[k].km!=null||log[k].pace||log[k].hr!=null));
    const realKm=ALL.reduce((s,k)=>s+((log[k]&&log[k].km)||0),0);
    const doneN=SESSIONS.filter(did).length;

    let h='<div class="tiles">'+
      '<div class="tile"><div class="v num">'+realKm.toFixed(0)+'</div><div class="l">km corsi finora</div></div>'+
      '<div class="tile"><div class="v num">'+PLAN_KM.toFixed(0)+'</div><div class="l">km totali del piano</div></div>'+
      '<div class="tile"><div class="v num">'+doneN+'/'+SESSIONS.length+'</div><div class="l">sedute completate</div></div>'+
      '<div class="tile"><div class="v num">'+daysTo+'</div><div class="l">giorni alla gara</div></div>'+
      '</div>';

    /* 1. ritmo + FC nel tempo */
    const withPace=logged.filter(k=>p2s(log[k].pace)!=null);
    const withHr=logged.filter(k=>log[k].hr!=null&&!isNaN(log[k].hr));
    if(withPace.length>=2||withHr.length>=2){
      const idx={}; logged.forEach((k,i)=>idx[k]=i);
      const n=logged.length;
      const xl=[];
      if(n>1){
        xl.push({x:0,t:fmt(MAP[logged[0]].date)});
        xl.push({x:n-1,t:fmt(MAP[logged[n-1]].date)});
      }
      h+='<div class="card chart"><h3>Ritmo e frequenza cardiaca</h3>'+
          '<p>Ogni punto è una seduta registrata. Se il ritmo scende mentre la FC resta ferma, la base aerobica sta migliorando.</p>';
      h+=svgLine([{pts:withPace.map(k=>({x:idx[k],y:p2s(log[k].pace)})),color:'var(--z-thr)'}],
                 {n:n,invert:false,h:118,fmtY:v=>s2p(v),xLabels:xl,aria:'Ritmo per seduta'});
      h+=svgLine([{pts:withHr.map(k=>({x:idx[k],y:log[k].hr})),color:'var(--z-int)'}],
                 {n:n,invert:false,h:112,fmtY:v=>Math.round(v),xLabels:xl,aria:'Frequenza cardiaca per seduta'});
      h+='<div class="ckey"><span><i style="background:var(--z-thr)"></i>ritmo (min/km, più basso = più veloce)</span>'+
         '<span><i style="background:var(--z-int)"></i>FC media (bpm)</span></div></div>';
    }

    /* 2. volume settimanale */
    const rows=WEEK_TEMPLATES.map((wt,w)=>{
      let a=0,b=0;
      for(let i=0;i<7;i++){
        const k=iso(addD(MON0,w*7+i));
        a+=MAP[k].entry.km||0;
        b+=(log[k]&&log[k].km)||0;
      }
      return {lbl:'S'+(w+1),a:a,b:b,color:'var(--z-mar)'};
    });
    h+='<div class="card chart"><h3>Volume settimanale</h3>'+
       '<p>Previsto a sinistra, corso a destra. Il calo alla settimana 5 è lo scarico prima del test dei 10 km.</p>'+
       svgBars(rows,{aria:'Km previsti e corsi per settimana'})+
       '<div class="ckey"><span><i style="background:#2F3B4A"></i>previsto</span>'+
       '<span><i style="background:var(--z-mar)"></i>corso</span></div></div>';

    /* 3. tipo di lavoro */
    const byType={};
    ALL.forEach(k=>{
      const e=MAP[k].entry;
      if(e.type==='riposo'||e.type==='mobilita')return;
      const km=(log[k]&&log[k].km)||0;
      if(!km)return;
      byType[e.type]=(byType[e.type]||0)+km;
    });
    const tk=Object.keys(byType);
    if(tk.length){
      const tot=tk.reduce((s,k)=>s+byType[k],0);
      h+='<div class="card chart"><h3>Come si distribuiscono i km corsi</h3>'+
         '<p>La maggior parte del volume deve stare sul facile e sul lungo: è lì che si costruisce la base.</p>';
      h+='<div style="display:flex;height:11px;border-radius:6px;overflow:hidden;margin-bottom:11px;">';
      tk.sort((a,b)=>byType[b]-byType[a]).forEach(t=>{
        h+='<i style="width:'+(byType[t]/tot*100).toFixed(1)+'%;background:'+(TYPE[t]||TYPE.riposo).c+'"></i>';
      });
      h+='</div><div class="ckey">';
      tk.forEach(t=>{h+='<span><i style="background:'+(TYPE[t]||TYPE.riposo).c+'"></i>'+
        (TYPE[t]||TYPE.riposo).lbl+' '+byType[t].toFixed(0)+' km</span>';});
      h+='</div></div>';
    }

    if(!logged.length){
      h+='<div class="empty"><p>Registra la prima seduta dalla scheda Oggi: i grafici si costruiscono da soli.</p></div>';
    }
    box.innerHTML=h;
  }

  /* ---------- sheet: export / import / reset ---------- */
  const sheet=document.getElementById('sheet');
  function openSheet(){
    document.getElementById('shMsg').textContent='';
    document.getElementById('shMain').innerHTML=
      '<div class="row"><button class="btn sm" id="sExp">Esporta</button>'+
      '<button class="btn sm" id="sImp">Importa</button>'+
      '<button class="btn sm" id="sRst">Azzera</button></div>'+
      '<div id="sArea" style="margin-top:12px;"></div>';
    document.getElementById('sExp').onclick=()=>{
      document.getElementById('sArea').innerHTML=
        '<p>Copia questo testo e conservalo: serve per rimettere i dati su un altro dispositivo.</p>'+
        '<textarea id="sTa" readonly></textarea>';
      document.getElementById('sTa').value=JSON.stringify({log:log,exportedAt:iso(new Date())});
      document.getElementById('sTa').select();
    };
    document.getElementById('sImp').onclick=()=>{
      document.getElementById('sArea').innerHTML=
        '<p>Incolla qui il testo esportato in precedenza.</p>'+
        '<textarea id="sTa" placeholder="{&quot;log&quot;:{…}}"></textarea>'+
        '<button class="btn go wide" id="sDo">Importa i dati</button>';
      document.getElementById('sDo').onclick=async()=>{
        const m=document.getElementById('shMsg');
        try{
          const p=JSON.parse(document.getElementById('sTa').value.trim());
          if(p.log&&typeof p.log==='object')log=p.log;
          else if(Array.isArray(p.completed)){log={};p.completed.forEach(d=>log[d]={done:true});}
          else throw new Error('bad');
          await save(); renderAll();
          m.style.color='var(--ok)'; m.textContent='Dati importati.';
        }catch(e){
          m.style.color='var(--bad)';
          m.textContent='Testo non valido: controlla di aver incollato tutto.';
        }
      };
    };
    document.getElementById('sRst').onclick=async()=>{
      if(!confirm('Azzerare tutti i dati registrati?'))return;
      log={};
      try{await window.storage.delete('training-log',false);}catch(e){}
      renderAll();
      const m=document.getElementById('shMsg');
      m.style.color='var(--dim)'; m.textContent='Diario azzerato.';
    };
    sheet.classList.add('on');
  }
  document.getElementById('gear').onclick=openSheet;
  document.getElementById('shClose').onclick=()=>sheet.classList.remove('on');
  sheet.onclick=ev=>{if(ev.target===sheet)sheet.classList.remove('on');};

  /* ---------- tabs ---------- */
  const tabs=[...document.querySelectorAll('nav.tabs button')];
  tabs.forEach(b=>{
    b.onclick=()=>{
      tabs.forEach(x=>x.setAttribute('aria-selected',String(x===b)));
      ['today','plan','stats'].forEach(s=>
        document.getElementById('scr-'+s).classList.toggle('on',s===b.dataset.scr));
      window.scrollTo(0,0);
    };
  });
  document.getElementById('wkPrev').onclick=()=>{if(curWeek>0){curWeek--;openDay=null;renderPlan();}};
  document.getElementById('wkNext').onclick=()=>{if(curWeek<WEEK_TEMPLATES.length-1){curWeek++;openDay=null;renderPlan();}};

  function renderAll(){renderToday();renderPlan();renderStats();}

  (async function init(){
    await load();
    const k=iso(new Date());
    if(MAP[k])curWeek=MAP[k].week;
    else if(new Date()>RACE_DATE)curWeek=WEEK_TEMPLATES.length-1;
    renderAll();
  })();
})();
</script>

<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('./sw.js').catch(function(e){console.warn('SW',e);});
  });
}
</script>
